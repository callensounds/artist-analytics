[project]
name = "artist-analytics"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "jinja2",
    "python-multipart",
    "python-dateutil",
    "pytz",
    "itsdangerous",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "httpx",
    "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
