<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Average Analytics{% endblock %}</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-x-hidden">
    <nav class="border-b border-slate-700 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap justify-between gap-x-4 gap-y-2 min-h-16 py-3 items-center">
                <a href="/" class="flex items-center gap-2 text-lg sm:text-xl font-bold min-w-0">
                    <span class="text-emerald-400">♪</span>
                    <span class="truncate">Average Analytics</span>
                </a>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
                    {% if user is defined and user %}
                        <a href="/dashboard" class="hover:text-emerald-400">Dashboard</a>
                        <a href="/admin/diag" class="hover:text-emerald-400">Diagnostics</a>
                        <span class="text-slate-400 truncate max-w-[10rem] sm:max-w-xs">{{ user.artist_name }}</span>
                        <a href="/logout" class="text-slate-400 hover:text-white">Logout</a>
                    {% else %}
                        <a href="/login" class="hover:text-emerald-400">Login</a>
                        <a href="/register" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg font-medium">Get Started</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-800 mt-16 py-8 text-center text-slate-500 text-sm">
        Average Analytics Beta — Exact timestamps & patterns that other platforms bury.
    </footer>
</body>
</html>
